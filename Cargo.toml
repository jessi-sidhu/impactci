[package]
name = "blast"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
git2 = { version = "0.21.0", default-features = false }
petgraph = "0.8.3"
rayon = "1.12.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tree-sitter = "0.27.1"
tree-sitter-python = "0.25.0"
walkdir = "2.5.0"

[dev-dependencies]
tempfile = "3.27.0"
